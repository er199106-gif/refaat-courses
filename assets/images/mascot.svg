<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mascot-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C63FF"/>
      <stop offset="100%" stop-color="#4A44D6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="2" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- الظل -->
  <ellipse cx="150" cy="260" rx="70" ry="20" fill="#000" opacity="0.2"/>
  
  <!-- الجسم الرئيسي -->
  <ellipse cx="150" cy="180" rx="85" ry="100" fill="url(#mascot-gradient)" filter="url(#shadow)"/>
  
  <!-- البطن -->
  <ellipse cx="150" cy="200" rx="65" ry="70" fill="white"/>
  
  <!-- الرأس -->
  <circle cx="150" cy="95" r="60" fill="url(#mascot-gradient)"/>
  
  <!-- الأذنان -->
  <ellipse cx="95" cy="65" rx="35" ry="45" fill="url(#mascot-gradient)" transform="rotate(-20 95 65)"/>
  <ellipse cx="205" cy="65" rx="35" ry="45" fill="url(#mascot-gradient)" transform="rotate(20 205 65)"/>
  
  <!-- العيون -->
  <circle cx="125" cy="85" r="20" fill="white" stroke="#333" stroke-width="2"/>
  <circle cx="175" cy="85" r="20" fill="white" stroke="#333" stroke-width="2"/>
  <circle cx="128" cy="82" r="10" fill="#333"/>
  <circle cx="178" cy="82" r="10" fill="#333"/>
  <circle cx="130" cy="78" r="4" fill="white"/>
  <circle cx="180" cy="78" r="4" fill="white"/>
  
  <!-- الحاجبان -->
  <path d="M110 70 Q125 60 135 65" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M165 65 Q175 60 190 70" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round"/>
  
  <!-- الفم -->
  <path d="M130 110 Q150 125 170 110" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round"/>
  
  <!-- النظارة -->
  <circle cx="125" cy="85" r="22" fill="none" stroke="#333" stroke-width="3"/>
  <circle cx="175" cy="85" r="22" fill="none" stroke="#333" stroke-width="3"/>
  <line x1="147" y1="85" x2="153" y2="85" stroke="#333" stroke-width="3"/>
  
  <!-- القبعة -->
  <path d="M100 45 L200 45 Q210 45 210 60 L190 85 L110 85 Q90 85 90 70 Z" fill="#FFE066" stroke="#333" stroke-width="3"/>
  <text x="150" y="72" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#6C63FF">R</text>
  
  <!-- الذراعان -->
  <path d="M70 180 Q40 200 30 230" stroke="url(#mascot-gradient)" stroke-width="25" fill="none" stroke-linecap="round"/>
  <path d="M230 180 Q260 200 270 230" stroke="url(#mascot-gradient)" stroke-width="25" fill="none" stroke-linecap="round"/>
  
  <!-- الأرجل -->
  <ellipse cx="120" cy="275" rx="25" ry="35" fill="#6C63FF" stroke="#333" stroke-width="2"/>
  <ellipse cx="180" cy="275" rx="25" ry="35" fill="#6C63FF" stroke="#333" stroke-width="2"/>
  
  <!-- الحذاء -->
  <ellipse cx="120" cy="305" rx="30" ry="15" fill="#333"/>
  <ellipse cx="180" cy="305" rx="30" ry="15" fill="#333"/>
  
  <!-- كتاب صغير -->
  <rect x="25" y="220" width="25" height="20" rx="3" fill="#74EBD5" stroke="#333" stroke-width="1.5"/>
  <rect x="28" y="223" width="19" height="14" fill="white"/>
  <circle cx="32" cy="227" r="1.5" fill="#6C63FF"/>
  <circle cx="37" cy="227" r="1.5" fill="#6C63FF"/>
  <circle cx="42" cy="227" r="1.5" fill="#6C63FF"/>
</svg>
