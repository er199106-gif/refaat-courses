<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skin-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD3B6"/>
      <stop offset="100%" stop-color="#FFB69D"/>
    </linearGradient>
    <linearGradient id="hair-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5D4037"/>
      <stop offset="100%" stop-color="#3E2723"/>
    </linearGradient>
    <linearGradient id="clothing-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C63FF"/>
      <stop offset="100%" stop-color="#4A44D6"/>
    </linearGradient>
  </defs>
  
  <!-- الخلفية -->
  <rect width="400" height="400" fill="#F0F7FF"/>
  
  <!-- الجسم الرئيسي -->
  <ellipse cx="200" cy="260" rx="85" ry="100" fill="url(#skin-gradient)"/>
  
  <!-- الرأس -->
  <circle cx="200" cy="150" r="65" fill="url(#skin-gradient)"/>
  
  <!-- الشعر -->
  <path d="M150 100 Q180 60 250 100 Q240 120 230 130 Q200 135 170 130 Q160 120 150 100" fill="url(#hair-gradient)"/>
  
  <!-- العيون -->
  <circle cx="170" cy="135" r="15" fill="white" stroke="#333" stroke-width="2"/>
  <circle cx="230" cy="135" r="15" fill="white" stroke="#333" stroke-width="2"/>
  <circle cx="175" cy="132" r="8" fill="#333"/>
  <circle cx="235" cy="132" r="8" fill="#333"/>
  <circle cx="178" cy="128" r="3" fill="white"/>
  <circle cx="238" cy="128" r="3" fill="white"/>
  
  <!-- الحاجبان -->
  <path d="M160 120 Q170 110 180 115" stroke="#333" stroke-width="3" fill="none"/>
  <path d="M220 115 Q230 110 240 120" stroke="#333" stroke-width="3" fill="none"/>
  
  <!-- الفم -->
  <path d="M180 160 Q200 175 220 160" stroke="#333" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- القميص -->
  <path d="M130 200 L270 200 L250 250 L150 250 Z" fill="url(#clothing-gradient)"/>
  <path d="M170 200 L150 250" stroke="white" stroke-width="2" stroke-dasharray="5 3"/>
  <path d="M230 200 L250 250" stroke="white" stroke-width="2" stroke-dasharray="5 3"/>
  <circle cx="200" cy="225" r="5" fill="white"/>
  
  <!-- الذراعان -->
  <path d="M100 210 Q70 240 70 270" stroke="url(#skin-gradient)" stroke-width="25" fill="none" stroke-linecap="round"/>
  <path d="M300 210 Q330 240 330 270" stroke="url(#skin-gradient)" stroke-width="25" fill="none" stroke-linecap="round"/>
  
  <!-- الأرجل -->
  <path d="M150 280 L130 330" stroke="url(#skin-gradient)" stroke-width="25" fill="none" stroke-linecap="round"/>
  <path d="M250 280 L270 330" stroke="url(#skin-gradient)" stroke-width="25" fill="none" stroke-linecap="round"/>
  
  <!-- الحذاء -->
  <ellipse cx="130" cy="335" rx="20" ry="10" fill="#3E2723"/>
  <ellipse cx="270" cy="335" rx="20" ry="10" fill="#3E2723"/>
  
  <!-- الرسوم التوضيحية -->
  <g transform="translate(100, 100)">
    <circle cx="0" cy="0" r="15" fill="#74EBD5" stroke="#6C63FF" stroke-width="2"/>
    <text x="0" y="5" font-family="VEXA, 'Segoe UI', Tahoma" font-size="12" text-anchor="middle" fill="white">١</text>
  </g>
  <g transform="translate(300, 100)">
    <circle cx="0" cy="0" r="15" fill="#74EBD5" stroke="#6C63FF" stroke-width="2"/>
    <text x="0" y="5" font-family="VEXA, 'Segoe UI', Tahoma" font-size="12" text-anchor="middle" fill="white">٢</text>
  </g>
  <g transform="translate(200, 350)">
    <circle cx="0" cy="0" r="15" fill="#74EBD5" stroke="#6C63FF" stroke-width="2"/>
    <text x="0" y="5" font-family="VEXA, 'Segoe UI', Tahoma" font-size="12" text-anchor="middle" fill="white">٣</text>
  </g>
</svg>
