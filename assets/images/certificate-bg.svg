<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cert-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C63FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4A44D6" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="star-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M20 5 L23 12 L30 12 L25 17 L26 24 L20 20 L14 24 L15 17 L10 12 L17 12 Z" fill="white" opacity="0.2"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feFlood flood-color="#FFE066" result="glowColor"/>
      <feComposite in="glowColor" in2="blur" operator="in" result="softGlow"/>
      <feBlend in="SourceGraphic" in2="softGlow" mode="screen"/>
    </filter>
  </defs>
  
  <!-- الخلفية بتدرج -->
  <rect width="800" height="600" fill="url(#cert-gradient)"/>
  
  <!-- نمط النجوم -->
  <rect width="800" height="600" fill="url(#star-pattern)"/>
  
  <!-- الإطار الذهبي -->
  <rect x="30" y="30" width="740" height="540" rx="20" fill="none" stroke="#FFE066" stroke-width="8" stroke-dasharray="30 15"/>
  
  <!-- الشعار العلوي -->
  <text x="400" y="100" font-family="Arial, sans-serif" font-size="48" font-weight="bold" text-anchor="middle" fill="white" filter="url(#glow)">Refaat Courses</text>
  
  <!-- النص الرئيسي -->
  <text x="400" y="220" font-family="Arial, sans-serif" font-size="36" text-anchor="middle" fill="white" font-weight="bold">شهادة إتمام</text>
  
  <!-- خط فاصل -->
  <line x1="200" y1="250" x2="600" y2="250" stroke="white" stroke-width="3" stroke-dasharray="10 5"/>
  
  <!-- اسم الطفل -->
  <text x="400" y="320" font-family="Arial, sans-serif" font-size="42" text-anchor="middle" fill="#FFE066" font-weight="bold" id="cert-name">اسم الطفل</text>
  
  <!-- نص التفاصيل -->
  <text x="400" y="380" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="white">لإكماله بنجاح جميع مهام الشهر الأول</text>
  <text x="400" y="420" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="white">بتفوق وإبداع ملحوظ</text>
  
  <!-- النجوم الزخرفية -->
  <path d="M150 480 L156 492 L170 492 L159 500 L162 514 L150 506 L138 514 L141 500 L130 492 L144 492 Z" fill="#FFE066" stroke="white" stroke-width="1.5"/>
  <path d="M650 480 L656 492 L670 492 L659 500 L662 514 L650 506 L638 514 L641 500 L630 492 L644 492 Z" fill="#FFE066" stroke="white" stroke-width="1.5"/>
  
  <!-- التوقيعات -->
  <line x1="200" y1="520" x2="350" y2="520" stroke="white" stroke-width="2"/>
  <line x1="450" y1="520" x2="600" y2="520" stroke="white" stroke-width="2"/>
  <text x="275" y="545" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="white">ولي الأمر</text>
  <text x="525" y="545" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="white">المنصة التعليمية</text>
  
  <!-- التاريخ -->
  <text x="400" y="580" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#74EBD5">يناير ٢٠٢٦</text>
  
  <!-- الشريط السفلي -->
  <rect x="0" y="570" width="800" height="30" fill="#FFE066"/>
  <text x="400" y="592" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#6C63FF" font-weight="bold">© 2026 ER199. All Rights Reserved.</text>
</svg>
