<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- تدرجات حديثة -->
    <linearGradient id="main-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C63FF"/>
      <stop offset="50%" stop-color="#74EBD5"/>
      <stop offset="100%" stop-color="#FFE066"/>
    </linearGradient>
    
    <linearGradient id="gold-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA500"/>
    </linearGradient>
    
    <!-- خطوط مخصصة -->
    <style type="text/css">
      @font-face {
        font-family: 'VEXA';
        src: url('../assets/fonts/VEXA-Regular.woff2') format('woff2');
        font-weight: normal;
        font-style: normal;
      }
      @font-face {
        font-family: 'MusketBold';
        src: url('../assets/fonts/MusketBold.woff2') format('woff2');
        font-weight: bold;
        font-style: normal;
      }
    </style>
  </defs>
  
  <!-- الخلفية الرئيسية -->
  <rect width="800" height="600" fill="url(#main-gradient)"/>
  
  <!-- دائرة مركزية خفيفة -->
  <circle cx="400" cy="300" r="280" fill="none" stroke="white" stroke-width="1" stroke-dasharray="10 5" opacity="0.3"/>
  
  <!-- الشعار العلوي بالإنجليزية -->
  <text x="400" y="160" font-family="MusketBold, Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="white" letter-spacing="2">
    <tspan>Refaat Courses</tspan>
  </text>
  
  <!-- الشعار العلوي بالعربية -->
  <text x="400" y="195" font-family="VEXA, 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="white" letter-spacing="1">
    <tspan>منصة رفعت التعليمية</tspan>
  </text>
  
  <!-- خط فاصل مزخرف -->
  <path d="M250 220 L550 220" stroke="white" stroke-width="3" stroke-dasharray="10 5"/>
  <circle cx="400" cy="220" r="8" fill="#FFE066"/>
  
  <!-- العنوان الرئيسي بالإنجليزية -->
  <text x="400" y="270" font-family="MusketBold, Arial, sans-serif" font-size="26" text-anchor="middle" fill="white" font-weight="bold">
    <tspan>CERTIFICATE OF ACHIEVEMENT</tspan>
  </text>
  
  <!-- العنوان الرئيسي بالعربية -->
  <text x="400" y="305" font-family="VEXA, 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif" font-size="28" text-anchor="middle" fill="white" font-weight="bold">
    <tspan>شهادة إتمام وإنجاز</tspan>
  </text>
  
  <!-- نص "يمنح لـ" بالإنجليزية -->
  <text x="400" y="350" font-family="MusketBold, Arial, sans-serif" font-size="18" text-anchor="middle" fill="white" opacity="0.9">
    <tspan>This Certificate is Presented to</tspan>
  </text>
  
  <!-- نص "يمنح لـ" بالعربية -->
  <text x="400" y="375" font-family="VEXA, 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif" font-size="20" text-anchor="middle" fill="white" opacity="0.9">
    <tspan>تُمنح هذه الشهادة إلى</tspan>
  </text>
  
  <!-- اسم الطفل (مكان فارغ للتعبئة) -->
  <rect x="250" y="390" width="300" height="50" rx="10" fill="white" opacity="0.2" stroke="#FFE066" stroke-width="2"/>
  <text x="400" y="420" font-family="MusketBold, Arial, sans-serif" font-size="28" text-anchor="middle" fill="white" font-weight="bold" id="cert-name">
    <tspan>[اسم الطفل]</tspan>
  </text>
  
  <!-- نص الإنجاز بالإنجليزية -->
  <text x="400" y="470" font-family="MusketBold, Arial, sans-serif" font-size="16" text-anchor="middle" fill="white" opacity="0.95">
    <tspan>For successfully completing all monthly challenges</tspan>
  </text>
  <text x="400" y="490" font-family="MusketBold, Arial, sans-serif" font-size="16" text-anchor="middle" fill="white" opacity="0.95">
    <tspan>with creativity, dedication, and excellence</tspan>
  </text>
  
  <!-- نص الإنجاز بالعربية -->
  <text x="400" y="520" font-family="VEXA, 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif" font-size="18" text-anchor="middle" fill="white" opacity="0.95">
    <tspan>لإتمامه جميع التحديات الشهرية بإبداع وتميز</tspan>
  </text>
  
  <!-- الكأس الذهبي في الأعلى -->
  <g transform="translate(400, 100)" opacity="0.9">
    <!-- قاعدة الكأس -->
    <ellipse cx="0" cy="50" rx="30" ry="12" fill="url(#gold-gradient)" stroke="#8B4513" stroke-width="2"/>
    
    <!-- جسم الكأس -->
    <path d="M-20 0 Q-30 -40 0 -60 Q30 -40 20 0 L15 40 Q0 50 -15 40 Z" fill="url(#gold-gradient)" stroke="#8B4513" stroke-width="2"/>
    
    <!-- نجمة على الكأس -->
    <path d="M0 -60 L3 -55 L8 -55 L5 -50 L6 -45 L0 -48 L-6 -45 L-5 -50 L-10 -55 L-3 -55 Z" fill="#FFE066" stroke="white" stroke-width="1"/>
  </g>
  
  <!-- الميدالية في الأسفل -->
  <g transform="translate(400, 550)">
    <circle cx="0" cy="0" r="25" fill="url(#gold-gradient)" stroke="#8B4513" stroke-width="2"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="white" stroke-width="1.5" stroke-dasharray="4 2"/>
    <path d="M0 -15 L5 -10 L10 -15 L8 0 L10 15 L5 10 L0 15 L-5 10 L-10 15 L-8 0 L-10 -15 L-5 -10 Z" fill="#6C63FF" stroke="white" stroke-width="1"/>
    <circle cx="0" cy="0" r="8" fill="#FFE066" stroke="white" stroke-width="1.5"/>
  </g>
  
  <!-- التوقيعات -->
  <g transform="translate(0, 50)">
    <!-- خط التوقيع الأيسر -->
    <line x1="200" y1="530" x2="350" y2="530" stroke="white" stroke-width="2" stroke-dasharray="5 3"/>
    <text x="275" y="555" font-family="MusketBold, Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">Parent's Signature</text>
    <text x="275" y="575" font-family="VEXA, 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif" font-size="14" text-anchor="middle" fill="white">توقيع ولي الأمر</text>
    
    <!-- خط التوقيع الأيمن -->
    <line x1="450" y1="530" x2="600" y2="530" stroke="white" stroke-width="2" stroke-dasharray="5 3"/>
    <text x="525" y="555" font-family="MusketBold, Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">Platform Director</text>
    <text x="525" y="575" font-family="VEXA, 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif" font-size="14" text-anchor="middle" fill="white">مدير المنصة</text>
  </g>
  
  <!-- النجوم الزخرفية -->
  <g opacity="0.7">
    <path d="M300 80 L303 85 L308 85 L305 89 L306 95 L300 91 L294 95 L295 89 L290 85 L297 85 Z" fill="#FFFFFF"/>
    <path d="M500 80 L503 85 L508 85 L505 89 L506 95 L500 91 L494 95 L495 89 L490 85 L497 85 Z" fill="#FFFFFF"/>
    <path d="M350 130 L353 135 L358 135 L355 139 L356 145 L350 141 L344 145 L345 139 L340 135 L347 135 Z" fill="#FFFFFF"/>
    <path d="M450 130 L453 135 L458 135 L455 139 L456 145 L450 141 L444 145 L445 139 L440 135 L447 135 Z" fill="#FFFFFF"/>
  </g>
  
  <!-- الشريط السفلي الذهبي -->
  <rect x="0" y="570" width="800" height="30" fill="url(#gold-gradient)"/>
  
  <!-- النص السفلي بالإنجليزية -->
  <text x="200" y="592" font-family="MusketBold, Arial, sans-serif" font-size="12" text-anchor="start" fill="#6C63FF" font-weight="bold">
    <tspan>© 2026 ER1991. All Rights Reserved.</tspan>
  </text>
  
  <!-- النص السفلي بالعربية -->
  <text x="600" y="592" font-family="VEXA, 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif" font-size="12" text-anchor="end" fill="#6C63FF" font-weight="bold">
    <tspan>جميع الحقوق محفوظة © ٢٠٢٦ ER1991</tspan>
  </text>
  
  <!-- أيقونة في الزاوية -->
  <g transform="translate(50, 550)">
    <circle cx="0" cy="0" r="12" fill="#FFE066" stroke="#6C63FF" stroke-width="2"/>
    <path d="M-4 -4 L4 -4 L0 4 Z" fill="#6C63FF"/>
  </g>
</svg>
